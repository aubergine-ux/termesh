name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux (Clang)
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Linux (no SIMD)
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_FLAGS=-DTERMESH_NO_SIMD
          - name: macOS (Apple Silicon)
            os: macos-latest
            cmake_args: ""
          - name: Windows (MSVC)
            os: windows-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Run the real binary end to end, with no terminal attached.
      - name: Smoke test
        shell: bash
        run: |
          bin=build/termesh
          [ -f build/Release/termesh.exe ] && bin=build/Release/termesh.exe
          "$bin" --version
          "$bin" --demo knot --png knot.png --size 640x480
          "$bin" --demo cube --gif cube.gif --size 160x120 --frames 12
          "$bin" --demo sphere --print --backend ascii --color none --cols 60 --rows 24
          "$bin" --demo knot --bench 50
          "$bin" --demo tentacle --list-animations
          "$bin" --demo tentacle --animation curl --anim-time 1.5 --png tentacle.png --size 320x240
          "$bin" --demo tentacle --gif tentacle.gif --size 160x120 --gif-fps 10
          "$bin" --demo tentacle --bench 50
          "$bin" --demo knot -s pbr --env sky --shadows --ssao --bloom --fxaa --png pbr.png --size 480x360
          "$bin" --demo cube -s toon --tonemap filmic --exposure 0.5 --png toon.png --size 320x240
          "$bin" --demo knot -s pbr --env sunset --shadows --bench 30
          "$bin" --demo knot --print --backend braille --dither ordered --color none --cols 60 --rows 20
          "$bin" --demo sphere --print --backend halfblock --color 256 --dither fs --cols 40 --rows 12
          test -s pbr.png && test -s toon.png
          "$bin" --demo knot --lod 1 --png lod.png --size 320x240
          "$bin" --benchmark --frames 2 --benchmark-json bench.json
          test -s lod.png && test -s bench.json
          test -s knot.png && test -s cube.gif && test -s tentacle.png && test -s tentacle.gif

  # Catch performance regressions: build this commit and the one before it,
  # and compare the instructions each benchmark scene executes.
  performance:
    name: Performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build this commit
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DTERMESH_BUILD_TESTS=OFF
          cmake --build build --parallel
      - name: Build the commit before
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git worktree add ../base "$base"
            cmake -S ../base -B ../base/build -DCMAKE_BUILD_TYPE=Release -DTERMESH_BUILD_TESTS=OFF
            cmake --build ../base/build --parallel
          else
            echo "nothing to compare against"
          fi
      - name: Compare
        run: |
          if git log -1 --pretty=%B | grep -qF '[perf-ok]'; then export PERF_ALLOW=1; fi
          scripts/perf-check.sh build/termesh ../base/build/termesh

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Render under sanitizers
        run: |
          build/termesh --demo knot --png knot.png --size 320x240
          build/termesh --demo cube --gif cube.gif --size 160x120 --frames 6
          build/termesh --demo tentacle --animation wave --gif tentacle.gif --size 160x120 --frames 8
          build/termesh --demo knot --print --backend sixel --cols 40 --rows 12 > /dev/null
          build/termesh --demo knot --print --backend braille --cols 40 --rows 12 > /dev/null
          build/termesh --demo knot -s pbr --env sky --shadows --ssao --bloom --outline --fxaa --png fx.png --size 320x240
          build/termesh --demo cube -s toon --shadows --light-angle 60 --png toon.png --size 200x150
          build/termesh --demo knot --print --backend sixel --dither fs --cols 30 --rows 10 > /dev/null
          build/termesh --demo knot --print --backend braille --dither fs --cols 30 --rows 10 > /dev/null
          build/termesh --demo sphere --print --backend ascii --dither ordered --color 256 --cols 30 --rows 10 > /dev/null
          build/termesh --demo knot --lod 2 --shadows --png lod.png --size 200x150
          build/termesh --demo tentacle --lod 2 --gif lod.gif --size 120x90 --frames 4
          build/termesh --benchmark --frames 2 > /dev/null
