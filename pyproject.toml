[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "termesh"
dynamic = ["version"]
description = "3D rendering without a GPU: a from-scratch software rasterizer that draws to pixels or to terminal text"
readme = "python/README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Aubergine-UX" }]
keywords = ["3d", "rendering", "rasterizer", "terminal", "gltf", "mesh", "software-renderer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Terminals",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/aubergine-ux/termesh"
Documentation = "https://github.com/aubergine-ux/termesh/blob/main/docs/python.md"
Issues = "https://github.com/aubergine-ux/termesh/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["python/termesh"]
sdist.exclude = [".github", "docs/media", "web"]

[tool.scikit-build.cmake.define]
TERMESH_PYTHON = "ON"
TERMESH_BUILD_TESTS = "OFF"
TERMESH_BUILD_LIBRARY = "OFF"

# One version number, kept in CMakeLists.txt.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(termesh\s+VERSION\s+(?P<value>[0-9.]+)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *_i686 *-musllinux_*"
test-requires = ["pytest"]
test-command = "pytest {project}/python/tests"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
